name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Make Maven wrapper executable
        # strip Windows line endings in case the wrapper was committed with CRLF
        run: |
          sed -i 's/\r$//' mvnw
          chmod +x mvnw

      - name: Build and test
        run: ./mvnw -B verify

  postgres:
    # Same test suite, but against a real PostgreSQL 16 instead of H2: proves the Flyway migrations, the
    # row locks (SELECT ... FOR UPDATE) and the unique guard constraints on the production database engine.
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: parking_ci
          POSTGRES_USER: parking
          POSTGRES_PASSWORD: parking-ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U parking -d parking_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # Environment variables override the H2 settings of the test profile
      SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/parking_ci
      SPRING_DATASOURCE_USERNAME: parking
      SPRING_DATASOURCE_PASSWORD: parking-ci-only
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: org.postgresql.Driver

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Make Maven wrapper executable
        run: |
          sed -i 's/\r$//' mvnw
          chmod +x mvnw

      - name: Test against PostgreSQL
        run: ./mvnw -B verify
