# Runs the API and a PostgreSQL 16 database.
# Usage: cp .env.example .env  (fill in DB_PASSWORD and JWT_SECRET), then: docker compose up --build
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: parking_system_db
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    env_file: .env
    environment:
      # Inside the compose network the database host is "db", not localhost
      DB_URL: jdbc:postgresql://db:5432/parking_system_db
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
