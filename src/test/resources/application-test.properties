# Test profile: in-memory H2 in PostgreSQL mode, no external database needed
spring.datasource.url=jdbc:h2:mem:parking_test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1;LOCK_TIMEOUT=10000
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
# Same Flyway migrations as production, so the tests also prove the migrations work
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
# Tests drive reservation expiry directly instead of waiting for the scheduler
app.scheduling.enabled=false

# Dummy secret for tests only (>= 32 bytes)
jwt.secret=test-only-jwt-secret-key-0123456789abcdef
jwt.expiration-ms=3600000
# Dummy webhook secret for tests only (>= 32 bytes)
app.payments.webhook-secret=test-only-webhook-secret-0123456789abcdef
