spring.application.name=Parking-System

# PostgreSQL: set DB_PASSWORD (and optionally DB_URL / DB_USERNAME) in the environment
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/parking_system_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Schema is owned by Flyway (src/main/resources/db/migration); Hibernate only checks that it matches.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
# A database created by an older version of this app (ddl-auto=update) is adopted as version 1.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

spring.jackson.serialization.write-dates-as-timestamps=false

# JWT: JWT_SECRET must be at least 32 characters
jwt.secret=${JWT_SECRET}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# CORS: comma separated list of allowed frontend origins
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}

# Optional initial admin account, created on startup only if all three are set:
# ADMIN_USERNAME, ADMIN_EMAIL, ADMIN_PASSWORD (read directly from the environment)

# Reservations: how long a reserved space is held for the driver, and how often no-shows are expired
app.reservation.hold-minutes=${RESERVATION_HOLD_MINUTES:30}
app.reservation.expiry-check-ms=${RESERVATION_EXPIRY_CHECK_MS:60000}
app.scheduling.enabled=true

# Payments: HMAC key shared with the payment provider for webhook signatures (at least 32 characters),
# how long a payment may wait for the provider's confirmation, and how old a signed webhook may be
app.payments.webhook-secret=${PAYMENT_WEBHOOK_SECRET}
app.payments.pending-timeout-minutes=${PAYMENT_TIMEOUT_MINUTES:15}
app.payments.webhook-tolerance-seconds=300
# The mock provider's checkout endpoints (/api/mock-provider/**); turn off when using a real provider
app.payments.mock.enabled=${PAYMENT_MOCK_ENABLED:true}

# Pricing. The defaults reproduce the original fixed prices.
# mode: HOURLY or SLAB (used for the bill created on exit); tax-rate: fraction of the base amount;
# grace-period-minutes: stays this short are free (0 = off); daily-cap-hours: most hours charged per started
# 24 hours (0 = off). SLAB bands default to 100% for hour 1, 90% to hour 3, 80% to hour 8, then 70%; override with
# app.pricing.slabs[0].up-to-hours=1, app.pricing.slabs[0].factor=1.00, ... (the last band has no up-to-hours).
app.pricing.mode=${PRICING_MODE:HOURLY}
app.pricing.tax-rate=${PRICING_TAX_RATE:0.10}
app.pricing.grace-period-minutes=${PRICING_GRACE_PERIOD_MINUTES:0}
app.pricing.daily-cap-hours=${PRICING_DAILY_CAP_HOURS:0}

# OpenAPI / Swagger UI at /swagger-ui.html
springdoc.swagger-ui.operations-sorter=alpha
